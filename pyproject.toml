[project]
name = "excel-table-bot"
version = "0.1.0"
description = "Telegram spreadsheet bot: conversational CRUD, template reformat, and smart compare. LLM plans the structure, a deterministic engine executes."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "M1zz1-ai" }]
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "redis>=5.0",
    "openpyxl>=3.1",
    "xlrd>=2.0.2",
    "rapidfuzz>=3.14.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "excel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pyflakes (F), import sorting (I), pyupgrade (UP), bugbear (B), and the
# error-level pycodestyle subsets — line length is left to judgment, not the linter.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
